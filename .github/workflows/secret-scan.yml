name: Secret Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Run gitleaks
        run: gitleaks git . --verbose
